  />
  <!-- Q tail -->
  <line
    x1="384.2" y1="330.0"
    x2="427.5" y2="355.0"
    stroke="#FFFFFF"
    stroke-width="52"
    stroke-linecap="round"
  />

  <!-- Center dot -->
